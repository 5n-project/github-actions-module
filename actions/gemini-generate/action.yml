name: "Gemini Generate"
description: "Call Gemini generateContent and return text output"

inputs:
  api_key:
    description: "Gemini API Key (pass from GitHub Secrets)"
    required: true
  model:
    description: "Model id (ex: gemini-2.5-flash)"
    required: true
  content:
    description: >-
      Final prompt content (inline).
      env 경유이므로 128KiB(MAX_ARG_STRLEN) 미만만 가능하다.
      대용량은 content_file 을 사용한다.
    required: false
    default: ""
  content_file:
    description: >-
      Final prompt content 파일 경로.
      지정하면 content 를 무시한다. 128KiB 초과 페이로드는 이 입력을 써야 한다.
    required: false
    default: ""
  temperature:
    required: false
    default: "0.1"
  max_output_tokens:
    required: false
    default: "2048"
  system_instruction:
    description: >-
      System instruction (inline). content 와 동일하게 128KiB 제약을 받는다.
    required: false
    default: ""
  system_instruction_file:
    description: >-
      System instruction 파일 경로. 지정하면 system_instruction 을 무시한다.
    required: false
    default: ""

outputs:
  text:
    description: "Generated text"
    value: ${{ steps.call.outputs.text }}
  text_file:
    description: "Generated text 파일 경로 (128KiB 초과에도 안전)"
    value: ${{ steps.call.outputs.text_file }}

runs:
  using: "composite"
  steps:
    - id: call
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.api_key }}
        MODEL: ${{ inputs.model }}
        CONTENT: ${{ inputs.content }}
        CONTENT_FILE: ${{ inputs.content_file }}
        TEMPERATURE: ${{ inputs.temperature }}
        MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
        SYSTEM_INSTRUCTION: ${{ inputs.system_instruction }}
        SYSTEM_INSTRUCTION_FILE: ${{ inputs.system_instruction_file }}
      run: |
        set -euo pipefail

        # =========
        # 0) 작업 파일 경로
        #    대용량 페이로드는 env/argv 를 경유시키지 않는다.
        #    (단일 env/argv 문자열 상한 = MAX_ARG_STRLEN = 128KiB, 초과 시 execve E2BIG)
        # =========
        WORK="${RUNNER_TEMP:-/tmp}"
        content_path="${WORK}/gemini_content.txt"
        sys_path="${WORK}/gemini_system.txt"
        body_path="${WORK}/gemini_body.json"
        resp_path="${WORK}/gemini_resp.json"
        text_path="${WORK}/gemini_text.txt"

        # =========
        # 1) content / system_instruction resolve (file 우선, inline 은 하위 호환)
        # =========
        if [ -n "${CONTENT_FILE}" ]; then
          if [ ! -f "${CONTENT_FILE}" ]; then
            echo "::error::content_file not found: ${CONTENT_FILE}"
            exit 1
          fi
          content_path="${CONTENT_FILE}"
        else
          printf '%s' "${CONTENT}" > "${content_path}"
        fi

        if [ ! -s "${content_path}" ]; then
          echo "::error::content is empty. Pass either 'content' or 'content_file'."
          exit 1
        fi

        has_sys="false"
        if [ -n "${SYSTEM_INSTRUCTION_FILE}" ]; then
          if [ ! -f "${SYSTEM_INSTRUCTION_FILE}" ]; then
            echo "::error::system_instruction_file not found: ${SYSTEM_INSTRUCTION_FILE}"
            exit 1
          fi
          sys_path="${SYSTEM_INSTRUCTION_FILE}"
          if [ -s "${sys_path}" ]; then has_sys="true"; fi
        elif [ -n "${SYSTEM_INSTRUCTION}" ]; then
          printf '%s' "${SYSTEM_INSTRUCTION}" > "${sys_path}"
          has_sys="true"
        fi

        echo "content=$(wc -c < "${content_path}") bytes, system_instruction=${has_sys}"

        # =========
        # 2) Build request body (jq --rawfile: 파일에서 직접 읽어 argv 우회)
        # =========
        if [ "${has_sys}" = "true" ]; then
          jq -n \
            --rawfile content "${content_path}" \
            --rawfile sys "${sys_path}" \
            --argjson temp "${TEMPERATURE}" \
            --argjson maxTok "${MAX_OUTPUT_TOKENS}" \
            '{
              systemInstruction: { parts: [ { text: $sys } ] },
              contents: [ { role: "user", parts: [ { text: $content } ] } ],
              generationConfig: { temperature: $temp, maxOutputTokens: $maxTok }
            }' > "${body_path}"
        else
          jq -n \
            --rawfile content "${content_path}" \
            --argjson temp "${TEMPERATURE}" \
            --argjson maxTok "${MAX_OUTPUT_TOKENS}" \
            '{
              contents: [ { role: "user", parts: [ { text: $content } ] } ],
              generationConfig: { temperature: $temp, maxOutputTokens: $maxTok }
            }' > "${body_path}"
        fi

        # =========
        # 3) HTTP request (network/timeout/status) hardening
        #    body 는 --data-binary @file 로 전송한다
        #    (-d "${BODY}" 는 argv 128KiB 한계에 걸린다)
        # =========
        url="https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent"

        http_code="$(
          curl -sS --fail-with-body \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 1 \
            --retry-all-errors \
            -o "${resp_path}" \
            -w "%{http_code}" \
            -X POST "$url" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @"${body_path}" \
          || true
        )"

        # curl 자체 실패(네트워크/timeout 등) -> http_code 비거나 000
        if [ -z "${http_code}" ] || [ "${http_code}" = "000" ]; then
          echo "::error::HTTP request failed (network/timeout)."
          exit 1
        fi

        # 2xx 아니면 실패 (본문 앞부분만 — 전량 덤프는 annotation 한계를 넘긴다)
        if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
          echo "::error::HTTP ${http_code} from Gemini API. Body: $(head -c 2000 "${resp_path}")"
          exit 1
        fi

        # =========
        # 4) JSON parse + API error object
        # =========
        jq -e . "${resp_path}" >/dev/null 2>&1 || {
          echo "::error::Non-JSON response from Gemini. Raw: $(head -c 2000 "${resp_path}")"
          exit 1
        }

        if jq -e '.error != null' "${resp_path}" >/dev/null; then
          code="$(jq -r '.error.code // empty' "${resp_path}")"
          status="$(jq -r '.error.status // empty' "${resp_path}")"
          msg="$(jq -r '.error.message // empty' "${resp_path}")"

          if [ "$code" = "429" ] || [ "$status" = "RESOURCE_EXHAUSTED" ]; then
            echo "::error::Gemini quota/rate limit (429/RESOURCE_EXHAUSTED): $msg"
          elif [ "$code" = "400" ] || [ "$status" = "INVALID_ARGUMENT" ]; then
            echo "::error::Gemini invalid request (400/INVALID_ARGUMENT): $msg"
          elif [ "$code" = "401" ] || [ "$status" = "UNAUTHENTICATED" ]; then
            echo "::error::Gemini auth failed (401/UNAUTHENTICATED): $msg"
          elif [ "$code" = "403" ] || [ "$status" = "PERMISSION_DENIED" ]; then
            echo "::error::Gemini permission denied (403/PERMISSION_DENIED): $msg"
          else
            echo "::error::Gemini API error (${code}/${status}): $msg"
          fi
          exit 1
        fi

        # =========
        # 5) Result validation (empty candidates/text) + parts join
        # =========
        jq -r '
          (.candidates // []) as $c
          | if ($c|length)==0 then "" else
              ($c[0].content.parts // [])
              | map(.text // "")
              | join("\n")
            end
        ' "${resp_path}" > "${text_path}"

        # jq -r 은 빈 문자열에도 개행 1바이트를 남긴다 -> 1바이트 이하면 빈 응답
        if [ "$(wc -c < "${text_path}")" -le 1 ]; then
          finish_reason="$(jq -r '.candidates[0].finishReason // empty' "${resp_path}")"
          echo "::error::Gemini returned empty text. finishReason=${finish_reason}. Raw: $(head -c 2000 "${resp_path}")"
          exit 1
        fi

        echo "text=$(wc -c < "${text_path}") bytes"

        # =========
        # 6) Output
        #    text_file : 128KiB 초과에도 안전한 경로 전달용 (권장)
        #    text      : 기존 caller 호환용.
        #                GITHUB_OUTPUT 자체는 통과하지만 이 값을 다시 env 로 넘기면
        #                128KiB 한계에 걸린다 -> 대용량 응답에서는 text_file 을 쓸 것
        # =========
        echo "text_file=${text_path}" >> "$GITHUB_OUTPUT"

        DELIM="__EOF_$(date +%s%N)__"
        {
          echo "text<<$DELIM"
          cat "${text_path}"
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"
